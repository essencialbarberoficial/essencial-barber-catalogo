<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Conta | Essencial Barber</title>
    <!-- CORREÇÃO: FontAwesome carregado sem bloquear a página — se esse CDN
         estiver lento ou inacessível na rede, a loja continua funcionando
         normalmente (só os ícones ficam ausentes até o CSS chegar, em vez
         de travar a página inteira em "Carregando"). -->
    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></noscript>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header>
    <div class="header-container">
        <div class="top-bar">
            <a href="index.html" class="store-name">Essencial <span>Barber</span></a>
        </div>
    </div>
</header>

<main class="container" style="max-width:640px;">
    <div class="breadcrumb"><a href="index.html">Home</a> &raquo; Minha Conta</div>

    <div class="section-title"><h2>Minha Conta</h2></div>

    <div class="card-panel" style="margin-bottom:20px; display:flex; justify-content:space-between; align-items:center;">
        <div>
            <div style="font-size:12px; color:var(--text-muted);">Você está logado como</div>
            <strong id="conta-nome-exibido" style="font-size:16px;">...</strong>
        </div>
        <button class="btn-secondary btn" onclick="sairDaConta()"><i class="fa-solid fa-right-from-bracket"></i> Sair</button>
    </div>

    <a href="#" onclick="falarNoWhatsAppMinhaConta(); return false;" class="btn btn-whatsapp-loja" style="width:100%; display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:24px; text-decoration:none;">
        <i class="fa-brands fa-whatsapp"></i> Dúvidas sobre sua compra? Fale no WhatsApp
    </a>

    <h4 style="font-size:13px; text-transform:uppercase; margin-bottom:12px; color:var(--text-muted);">Meus Pedidos</h4>
    <div id="lista-pedidos-conta">
        <div class="empty-msg">Carregando...</div>
    </div>
</main>

<footer>
    <div class="footer-bottom">Essencial Barber</div>
</footer>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/minha-conta.js"></script>
</body>
</html>
